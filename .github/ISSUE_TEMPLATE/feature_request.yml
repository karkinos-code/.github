name: Feature request
description: Suggest a new model, integrator, diagnostic, or other improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include equations or references if relevant.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core types and traits
        - Integrators
        - Media and wake models
        - Physics (dynamical systems)
        - Diagnostics and output
        - Input deck and CLI
        - Python bindings
        - Documentation
        - Other
